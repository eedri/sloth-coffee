<!doctype html>
<!-- Stand sign, A5 at 150 dpi (1240 x 1748 px). Render with sign/render.swift.
     No question count on purpose, so the sign survives quiz changes. -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1240px; height: 1748px; box-sizing: border-box;
    padding: 70px 90px; background: #f8eee0; color: #4a2a14;
    font-family: system-ui, -apple-system, "Arial Hebrew", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .logo {
    width: 760px; mix-blend-mode: darken;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent), linear-gradient(to bottom, transparent, #000 10%, #000 90%, transparent);
    -webkit-mask-composite: source-in;
  }
  h1 { font-size: 96px; line-height: 1.1; margin: 10px 0 18px; color: #7a3b17; }
  .sub { font-size: 50px; margin: 0 0 46px; color: #4a2a14; }
  .qr {
    width: 600px; height: 600px; padding: 40px; background: #fffaf0;
    border: 10px solid #b5651d; border-radius: 48px;
  }
  .qr img { width: 100%; height: 100%; display: block; }
  .en { direction: ltr; font-size: 38px; margin: 42px 0 0; color: #8a6a4e; line-height: 1.35; }
  .url { direction: ltr; font-size: 36px; margin: auto 0 0; color: #7a3b17; font-weight: 700; letter-spacing: 1px; }
</style>
</head>
<body>
  <img class="logo" src="../assets/logo.jpg" alt="">
  <h1>איזה משקה מתאים לכם?</h1>
  <p class="sub">סרקו, ענו על כמה שאלות, והעצלן יחליט. לאט.</p>
  <div class="qr"><img src="qr.svg" alt=""></div>
  <p class="en">Which drink is right for you?<br>Scan, answer a few questions, the sloth decides. Slowly.</p>
  <p class="url">eedri.github.io/sloth-coffee</p>
</body>
</html>
